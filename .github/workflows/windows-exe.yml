name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra transcription --extra ocr

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Build one-file executable
        run: uv run --no-sync python scripts/build.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AIO-Media-Tool-Windows
          path: dist/AIO-Media-Tool.exe
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" dist/AIO-Media-Tool.exe --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" dist/AIO-Media-Tool.exe --generate-notes --title "AIO Media Tool $env:GITHUB_REF_NAME"
          }
